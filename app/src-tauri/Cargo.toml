[package]
name = "app"
version = "2.0.0"
description = "Turn your Telegram account into an unlimited, ad-free, secure cloud storage drive. A high-performance desktop app built with Tauri v2, Rust, and React."
authors = ["chauhan-pratham"]
edition = "2021"



[lib]

name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git", rev = "c34290345a4636ff689cec312e655419e5972609", features = ["proxy"] }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git", rev = "c34290345a4636ff689cec312e655419e5972609" }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers.git", rev = "c34290345a4636ff689cec312e655419e5972609", features = ["proxy"] }
grammers-tl-types = { git = "https://codeberg.org/Lonami/grammers.git", rev = "c34290345a4636ff689cec312e655419e5972609" }
tokio = { version = "1", features = ["full"] }

tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chrono = "0.4"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2"
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
futures = "0.3"
async-stream = "0.3"
actix-rt = "2"
tauri-plugin-process = "2"
bitflags = "=2.10.0"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
rand = "0.9"
sha2 = "0.10"
bcrypt = "0.16"
constant_time_eq = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.7"
path-clean = "1"
walkdir = "2"
mp4parse = "0.17"
urlencoding = "2"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "socks"] }
sysinfo = "0.30"
tempfile = "3"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"

unrar = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = "0.32"

[package.metadata.tauri.bundle.windows]
# Embed the WebView2 bootstrapper so the app works on Windows systems
# where the WebView2 runtime is not pre-installed (fresh installs, servers, etc.)
webview-install-mode = "embeddir"

# Speed up incremental dev builds
[profile.dev]
incremental = true

# Optimize dependencies once in dev mode so incremental rebuilds are fast
[profile.dev.package."*"]
opt-level = 3


