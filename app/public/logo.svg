<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#24A1DE" />
      <stop offset="100%" stop-color="#0088CC" />
    </linearGradient>
    <!-- Glow Effect / Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="17.5" stroke="white" stroke-opacity="0.15" stroke-width="1" />
  
  <!-- Cloud & Paper Plane Group -->
  <g filter="url(#glow)">
    <!-- Sleek Cloud Outline in background -->
    <path d="M42 42h2c4.4 0 8-3.6 8-8s-3.6-8-8-8c-.5 0-1 0-1.5.1C40.6 20.3 35.8 16 30 16c-6.1 0-11.1 4.5-11.9 10.4C17.5 26.1 17 26 16.5 26c-4.7 0-8.5 3.8-8.5 8.5S11.8 43 16.5 43" 
          stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.4" />
    
    <!-- Rising Paper Plane in foreground -->
    <path d="M44 20L18 31.5L28.5 35.5L32.5 46L44 20Z" fill="white" />
    <!-- Paper Plane details -->
    <path d="M44 20L28.5 35.5L32.5 46" stroke="#0088CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
