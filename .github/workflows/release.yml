name: "Release"

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.0.1
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions Web UI

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./app/package.json').version")
            echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Verify tag matches app version
        shell: node {0}
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          const fs = require('fs');

          const tagVersion = (process.env.TAG_VERSION || '').trim();
          const packageJson = JSON.parse(fs.readFileSync('app/package.json', 'utf8'));
          const tauriConfig = JSON.parse(fs.readFileSync('app/src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = fs.readFileSync('app/src-tauri/Cargo.toml', 'utf8');
          const cargoVersionMatch = cargoToml.match(/^version\s*=\s*"([^"]+)"/m);
          const cargoVersion = cargoVersionMatch ? cargoVersionMatch[1] : '';

          const mismatches = [
            ['app/package.json', packageJson.version],
            ['app/src-tauri/tauri.conf.json', tauriConfig.version],
            ['app/src-tauri/Cargo.toml', cargoVersion],
          ].filter(([, version]) => version !== tagVersion);

          if (mismatches.length > 0) {
            console.error(`Tag version v${tagVersion} does not match app version metadata:`);
            for (const [file, version] of mismatches) {
              console.error(`- ${file}: ${version || '(missing)'}`);
            }
            process.exit(1);
          }
      
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          REPO="${{ github.repository }}"

          DOWNLOAD_TABLE="### 🚀 Direct Download Installers

          | Platform | Recommended Installer | Alternative |
          |:---|:---|:---|
          | 🪟 **Windows** | [📥 Download Setup (.exe)](https://github.com/${REPO}/releases/download/v${VERSION}/Telegram.Drive_${VERSION}_x64-setup.exe) | [.msi Installer](https://github.com/${REPO}/releases/download/v${VERSION}/Telegram.Drive_${VERSION}_x64_en-US.msi) |
          | 📱 **Android** | [📥 Download APK (.apk)](https://github.com/${REPO}/releases/download/v${VERSION}/app-universal-release.apk) | - |
          | 🍏 **macOS (Intel)** | [📥 Download Mac Intel (.dmg)](https://github.com/${REPO}/releases/download/v${VERSION}/Telegram.Drive_${VERSION}_x64.dmg) | - |
          | 🍏 **macOS (Apple Silicon)** | [📥 Download Mac M1/M2/M3 (.dmg)](https://github.com/${REPO}/releases/download/v${VERSION}/Telegram.Drive_${VERSION}_aarch64.dmg) | - |
          | 🐧 **Linux** | [📥 Download AppImage](https://github.com/${REPO}/releases/download/v${VERSION}/Telegram.Drive_${VERSION}_amd64.AppImage) | [.deb Package](https://github.com/${REPO}/releases/download/v${VERSION}/Telegram.Drive_${VERSION}_amd64.deb) |

          ---
          "

          if [ -f CHANGELOG.md ]; then
            CHANGELOG_BODY=$(awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]" { capture=1; matched=1; next }
              /^## \[/ && capture { exit }
              capture { print; next }
              /^## \[/ && !matched && !fallback_seen { fallback_seen=1; next }
              /^## \[/ && fallback_seen { exit }
              fallback_seen { print }
            ' CHANGELOG.md)
          else
            CHANGELOG_BODY="Release v$VERSION"
          fi

          if [ -z "$CHANGELOG_BODY" ]; then
            CHANGELOG_BODY="Release v$VERSION"
          fi

          FULL_BODY="${DOWNLOAD_TABLE}
          ${CHANGELOG_BODY}"

          # Escape for GitHub Actions output
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$FULL_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              name: `v${process.env.VERSION}`,
              body: process.env.BODY,
              draft: true,
              prerelease: false
            });
            return data.id;
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          BODY: ${{ steps.changelog.outputs.BODY }}

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            args: ''
            target: ''
          
          # Linux
          - platform: ubuntu-22.04
            args: ''
            target: ''
            
          # macOS Intel
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          
          # macOS Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Prepare Tauri signing key
        shell: node {0}
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          const fs = require('fs');
          const key = (process.env.KEY || '').replace(/\r\n/g, '\n').trim();
          if (key) {
            const delimiter = 'TAURI_KEY_EOF';
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `TAURI_SIGNING_PRIVATE_KEY<<${delimiter}\n${key}\n${delimiter}\n`
            );
          } else {
            console.log('No Tauri signing key secret found; skipping signing configuration.');
          }

      - name: Build the app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: ./app
          args: ${{ matrix.args }}

      - name: Patch AppImage for cross-distro EGL compatibility
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail

          APPIMAGE_DIR="app/src-tauri/target/release/bundle/appimage"
          APPIMAGE=$(find "$APPIMAGE_DIR" -maxdepth 1 -name "*.AppImage" -type f 2>/dev/null | head -1)

          if [ -z "$APPIMAGE" ]; then
            echo "::warning::No .AppImage found under $APPIMAGE_DIR — skipping patch step"
            exit 0
          fi

          echo "--- Found AppImage: $APPIMAGE ---"
          chmod +x "$APPIMAGE"

          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          # Extract the AppImage
          "$APPIMAGE" --appimage-extract

          # ── Strip bundled EGL / GL / GLVND libs that shadow host GPU drivers ──
          STRIP_LIBS=(
            libEGL.so      libEGL.so.1
            libGL.so       libGL.so.1
            libGLdispatch.so libGLdispatch.so.0
            libGLX.so      libGLX.so.0
            libGLESv2.so   libGLESv2.so.2
          )
          for lib in "${STRIP_LIBS[@]}"; do
            find squashfs-root -name "$lib" -type f -delete -o -name "$lib" -type l -delete 2>/dev/null || true
          done
          echo "--- Stripped ${#STRIP_LIBS[@]} bundled GL/EGL library patterns ---"

          # ── Detect inner binary name ──
          # Stage 1: parse the .desktop file's Exec= line (most reliable)
          INNER_BIN=$(find squashfs-root -maxdepth 2 -name "*.desktop" | \
            xargs -I{} awk -F= '/^Exec=/{print $2; exit}' {} 2>/dev/null | \
            awk '{print $1}' | xargs basename 2>/dev/null || true)
          # Stage 2: first executable file in usr/bin
          if [ -z "$INNER_BIN" ]; then
            INNER_BIN=$(ls squashfs-root/usr/bin/ 2>/dev/null | head -1 || true)
          fi
          if [ -z "$INNER_BIN" ]; then
            echo "::error::Could not detect inner binary name — aborting patch"
            exit 1
          fi
          echo "--- Inner binary: $INNER_BIN ---"

          # ── Write new AppRun ──
          cat > squashfs-root/AppRun << 'APPRUN_EOF'
          #!/usr/bin/env bash
          # ── Telegram Drive — cross-distro AppRun wrapper ──
          # Fixes EGL_BAD_ALLOC on Arch/Fedora/rolling-release distros by ensuring
          # the host's GPU driver stack is used instead of bundled Ubuntu Mesa libs.
          set -u

          SELF="$(readlink -f "$0")"
          APPDIR="${SELF%/*}"
          export APPDIR

          # ── 1. Locale: normalise to C.UTF-8 if current locale is not generated ──
          if ! locale -a 2>/dev/null | grep -qi "^${LANG:-C}$"; then
            export LANG="C.UTF-8"
            export LC_ALL="C.UTF-8"
          fi

          # ── 2. Silence AT-SPI / atk-bridge warnings when no a11y bus is present ──
          export NO_AT_BRIDGE=1

          # ── 3. Auto-detect EGL platform ──
          if [ -z "${EGL_PLATFORM:-}" ]; then
            if [ -n "${WAYLAND_DISPLAY:-}" ]; then
              export EGL_PLATFORM=wayland
            elif [ -n "${DISPLAY:-}" ]; then
              export EGL_PLATFORM=x11
            else
              export EGL_PLATFORM=surfaceless
            fi
          fi

          # ── 4. Point GLVND at system vendor ICDs ──
          GLVND_DIRS=""
          for d in /usr/share/glvnd/egl_vendor.d /etc/glvnd/egl_vendor.d; do
            [ -d "$d" ] && GLVND_DIRS="${GLVND_DIRS:+$GLVND_DIRS:}$d"
          done
          if [ -n "$GLVND_DIRS" ]; then
            export __EGL_VENDOR_LIBRARY_DIRS="$GLVND_DIRS"
          fi

          # ── 5. Preload first found system libEGL.so.1 ──
          SYS_EGL=""
          for p in /usr/lib/x86_64-linux-gnu/libEGL.so.1 \
                   /usr/lib64/libEGL.so.1 \
                   /usr/lib/libEGL.so.1; do
            if [ -f "$p" ]; then
              SYS_EGL="$p"
              break
            fi
          done
          if [ -n "$SYS_EGL" ]; then
            export LD_PRELOAD="${LD_PRELOAD:+$LD_PRELOAD:}$SYS_EGL"
          fi

          # ── 6. Software rendering fallback (opt-in via LIBGL_ALWAYS_SOFTWARE=1) ──
          if [ "${LIBGL_ALWAYS_SOFTWARE:-0}" = "1" ]; then
            export GALLIUM_DRIVER=llvmpipe
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
          fi

          # ── 7. LD_LIBRARY_PATH: system paths BEFORE bundled paths ──
          SYS_LIB_PATHS="/usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/lib"
          BUNDLED_PATHS="${APPDIR}/usr/lib:${APPDIR}/lib"
          export LD_LIBRARY_PATH="${SYS_LIB_PATHS}:${BUNDLED_PATHS}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          # ── 8. Exec the inner binary ──
          exec "${APPDIR}/usr/bin/__INNER_BIN__" "$@"
          APPRUN_EOF

          # Un-indent the heredoc (it was indented for YAML readability)
          sed -i 's/^          //' squashfs-root/AppRun

          # Inject the detected binary name
          sed -i "s|__INNER_BIN__|${INNER_BIN}|g" squashfs-root/AppRun
          chmod +x squashfs-root/AppRun

          echo "--- New AppRun written and configured ---"

          # ── Repack with gzip compression ──
          # APPIMAGE_EXTRACT_AND_RUN=1 avoids needing the FUSE kernel module
          # on GitHub Actions runners (appimagetool is itself an AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            ./appimagetool-x86_64.AppImage --comp gzip squashfs-root "$APPIMAGE"

          # Cleanup
          rm -rf squashfs-root appimagetool-x86_64.AppImage

          echo "::notice::AppImage patched successfully for cross-distro EGL compatibility"

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install NDK & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "build-tools;34.0.0"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Android APK
        working-directory: app
        run: |
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ] && [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          fi
          echo "Detected NDK Directory: $NDK_DIR"

          export NDK_HOME="$NDK_DIR"
          export PATH="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          APKSIGNER_CMD=$(find "$ANDROID_HOME/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_CMD" ]; then
            APKSIGNER_CMD="apksigner"
          fi

          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi
          # Ensure Gradle uses debug signing config and forces -Wl,-z,muldefs in task environment
          find src-tauri/gen/android/app -name "build.gradle.kts" | while read -r GRADLE_FILE; do
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' "$GRADLE_FILE" || true
            echo 'tasks.withType(Exec::class.java).configureEach { environment("RUSTFLAGS", "-C link-arg=-Wl,-z,muldefs") }' >> "$GRADLE_FILE"
          done

          npx tauri android build

          # Auto-sign any unsigned APKs using Android SDK's apksigner
          find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" 2>/dev/null | while read -r UNSIGNED_APK; do
            SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}.apk"
            echo "Signing $UNSIGNED_APK -> $SIGNED_APK"
            keytool -genkey -v -keystore release.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,OU=Android,O=Android,L=Android,ST=Android,C=US" 2>/dev/null || true
            "$APKSIGNER_CMD" sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --out "$SIGNED_APK" "$UNSIGNED_APK"
            rm -f "$UNSIGNED_APK"
          done

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.release_id }}
          files: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [create-release, build-tauri, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              prerelease: false
            });
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
